name: Check data

on:
  push:
  pull_request:

# Read only: this check never needs to write to the repo.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate poses.json
        run: python scripts/validate.py
      - name: Python and web prompts match
        run: node tests/parity.mjs
      - name: Python and web scenes match
        run: node tests/scene_parity.mjs
      - name: Python and web outfits match
        run: node tests/outfit_parity.mjs
      - name: Camera prompts match between Python and JS
        run: node tests/camera_parity.mjs
      - name: Your own choices merge the same in Python and JS
        run: node tests/choices_parity.mjs
      - name: The Call Sheet node matches the Studio
        run: node tests/callsheet_parity.mjs
      - name: Prompt list import
        run: node tests/custom_import.mjs
