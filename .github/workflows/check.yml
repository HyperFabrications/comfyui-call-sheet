name: Check data

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate poses.json
        run: python scripts/validate.py
      - name: Python and web prompts match
        run: node tests/parity.mjs
      - name: Python and web scenes match
        run: node tests/scene_parity.mjs
      - name: Python and web outfits match
        run: node tests/outfit_parity.mjs
